let currentChart = null;
let currentMetric = 'clicks';
let currentPeriod = 0; // 0 = 全期間, N = 直近Nヶ月
const GRANULARITY = DATA.granularity || 'monthly'; // 'weekly' or 'monthly'

document.getElementById('site-title').textContent = DATA.site + ' クラスターレポート';
document.getElementById('generated-at').textContent = '最終更新: ' + DATA.generated_at;

const sidebar = document.getElementById('sidebar');
DATA.topics.forEach((topic) => {
  const totalClicks = topic.articles.reduce((s, a) => s + a.clicks, 0);
  const el = document.createElement('div');
  el.className = 'sidebar-item';
  el.innerHTML = '<span>' + topic.name + '</span><span class="sidebar-count">' + totalClicks.toLocaleString() + '</span>';
  el.onclick = () => {
    document.querySelectorAll('.sidebar-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    renderTopic(topic);
  };
  sidebar.appendChild(el);
});

function renderTopic(topic) {
  const pillar = topic.pillar;
  const pillarHtml = pillar
    ? '<a href="' + pillar.url + '" target="_blank">' + pillar.title + '</a>'
    : '（ピラーなし）';

  const main = document.getElementById('main');
  main.innerHTML =
    '<h2 class="topic-title">' + topic.name + '</h2>' +
    '<div class="pillar-label">ピラー: ' + pillarHtml + '</div>' +
    '<div class="chart-controls">' +
      '<div class="metric-btns">' +
        '<button id="btn-clicks">クリック</button>' +
        '<button id="btn-impressions">表示回数</button>' +
        '<button id="btn-position">順位</button>' +
      '</div>' +
      '<div class="period-btns">' +
        '<button id="btn-p3">3ヶ月</button>' +
        '<button id="btn-p6">6ヶ月</button>' +
        '<button id="btn-p0">全期間</button>' +
      '</div>' +
    '</div>' +
    '<div class="chart-wrap"><canvas id="chart"></canvas></div>' +
    '<div class="chart-legend" id="chart-legend"></div>' +
    '<table>' +
      '<thead><tr><th>タイトル</th><th>クリック</th><th>表示回数</th><th>順位</th><th>キーイベント</th></tr></thead>' +
      '<tbody id="article-tbody"></tbody>' +
    '</table>';

  const sorted = [...topic.articles].sort((a, b) => {
    if (a.role === 'pillar') return -1;
    if (b.role === 'pillar') return 1;
    return b.clicks - a.clicks;
  });
  const tbody = document.getElementById('article-tbody');
  sorted.forEach(a => {
    const tr = document.createElement('tr');
    if (a.role === 'pillar') tr.className = 'pillar-row';
    tr.innerHTML =
      '<td>' + (a.role === 'pillar' ? '★ ' : '') +
      '<a href="' + a.url + '" target="_blank">' + a.title + '</a></td>' +
      '<td>' + a.clicks.toLocaleString() + '</td>' +
      '<td>' + a.impressions.toLocaleString() + '</td>' +
      '<td>' + a.position + '</td>' +
      '<td>' + (a.key_events > 0 ? a.key_events.toLocaleString() : '—') + '</td>';
    tbody.appendChild(tr);
  });

  setActiveBtn(currentMetric);
  setActivePeriod(currentPeriod);
  drawChart(topic, currentMetric, currentPeriod);

  ['clicks', 'impressions', 'position'].forEach(m => {
    document.getElementById('btn-' + m).onclick = () => {
      currentMetric = m;
      setActiveBtn(m);
      drawChart(topic, m, currentPeriod);
    };
  });
  [{id: 'btn-p3', val: 3}, {id: 'btn-p6', val: 6}, {id: 'btn-p0', val: 0}].forEach(({id, val}) => {
    document.getElementById(id).onclick = () => {
      currentPeriod = val;
      setActivePeriod(val);
      drawChart(topic, currentMetric, val);
    };
  });
}

function setActiveBtn(metric) {
  ['clicks', 'impressions', 'position'].forEach(m => {
    const btn = document.getElementById('btn-' + m);
    if (btn) btn.classList.toggle('active', m === metric);
  });
}

function setActivePeriod(period) {
  [{id: 'btn-p3', val: 3}, {id: 'btn-p6', val: 6}, {id: 'btn-p0', val: 0}].forEach(({id, val}) => {
    const btn = document.getElementById(id);
    if (btn) btn.classList.toggle('active', val === period);
  });
}

function drawChart(topic, metric, period) {
  if (currentChart) { currentChart.destroy(); currentChart = null; }
  const monthSet = new Set();
  topic.articles.forEach(a => a.history.forEach(h => monthSet.add(h.month)));
  let months = [...monthSet].sort();
  if (period > 0) {
    const points = GRANULARITY === 'weekly' ? Math.round(period * 4.33) : period;
    months = months.slice(-points);
  }
  if (months.length === 0) return;

  const palette = ['#4285f4','#ea4335','#fbbc04','#34a853','#ff6d00','#46bdc6','#7c4dff','#e91e63','#00bcd4','#8bc34a'];
  const datasets = topic.articles.map((a, i) => {
    const hmap = {};
    a.history.forEach(h => { hmap[h.month] = parseFloat(h[metric]); });
    return {
      label: a.title.length > 22 ? a.title.slice(0, 22) + '…' : a.title,
      data: months.map(m => hmap[m] !== undefined ? hmap[m] : null),
      borderColor: palette[i % palette.length],
      backgroundColor: 'transparent',
      spanGaps: true,
      tension: 0.3,
      pointRadius: 3,
    };
  });

  currentChart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: months, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: {
          reverse: metric === 'position',
          title: { display: true, text: metric }
        }
      },
      plugins: { legend: { display: false } }
    }
  });

  const legendEl = document.getElementById('chart-legend');
  if (legendEl) {
    legendEl.innerHTML = '';
    datasets.forEach((ds, i) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML =
        '<div class="legend-dot" style="background:' + ds.borderColor + '"></div>' +
        '<span>' + ds.label + '</span>';
      item.onclick = () => {
        const meta = currentChart.getDatasetMeta(i);
        meta.hidden = !meta.hidden;
        item.classList.toggle('hidden', meta.hidden);
        currentChart.update();
      };
      legendEl.appendChild(item);
    });
  }
}
